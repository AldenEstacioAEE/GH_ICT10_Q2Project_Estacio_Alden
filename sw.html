<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Club Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        nav.navbar {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            background-color: #ffffff !important;
            padding-left: 30px;
            padding-right: 30px;
            width: 100%;
        }

        nav.navbar .nav-link {
            color: #333333 !important;
        }

        :root {
            --bg1: #f0f4ff;
            --bg2: #e6f7ff;
            --bg3: #fdf2ff;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.9);
            --accent: #8b7cf6;
            --accent2: #4fc3f7;
            --accent-deep: #6d5bd0;
            --text: #2d2b55;
            --muted: #8b90a8;
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-border: rgba(141, 141, 190, 0.25);
            --success: #4ade80;
            --error: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text);
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating ambient orbs */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            z-index: 0;
        }

        body::before {
            width: 350px;
            height: 350px;
            background: #c4b5fd;
            top: -100px;
            left: -100px;
            animation: float1 10s ease-in-out infinite;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: #a5e8ff;
            bottom: -80px;
            right: -80px;
            animation: float2 12s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 60px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-40px, -50px); }
        }

        .card {
            position: relative;
            z-index: 1;
            width: 400px;
            padding: 42px 36px;
            border-radius: 24px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(109, 91, 208, 0.15), inset 0 1px 0 rgba(255,255,255,0.8);
            border: 1px solid var(--card-border);
            text-align: center;
            animation: cardEnter 0.6s cubic-bezier(.22,1,.36,1);
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(139, 124, 246, 0.12);
            border: 1px solid rgba(139, 124, 246, 0.3);
            color: var(--accent-deep);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent2);
            box-shadow: 0 0 8px var(--accent2);
        }

        h2 {
            margin: 0 0 6px;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-deep), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 400;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            position: relative;
            text-align: left;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            margin-left: 2px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: rgba(45, 43, 85, 0.3);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px rgba(139, 124, 246, 0.15);
        }

        input[type="button"] {
            margin-top: 6px;
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-family: inherit;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: white;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 10px 25px rgba(139, 124, 246, 0.3);
        }

        input[type="button"]:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 30px rgba(139, 124, 246, 0.4);
        }

        input[type="button"]:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 22px;
            min-height: 28px;
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        #result:not(:empty) {
            background: rgba(139, 124, 246, 0.08);
            border: 1px solid rgba(139, 124, 246, 0.15);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="collapse navbar-collapse show" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Meet the creator</a>
                    </li>
                    <li class="nav-item">
                        <a href="drill.html" class="nav-link">Club Members</a>
                    </li>
                    <li class="nav-item">
                        <a href="sw.html" class="nav-link">Member Checker</a>
                    </li>
                    <li class="nav-item">
                        <a href="skillstest.html" class="nav-link">Element Checker</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="card">
        <span class="badge">Member Lookup</span>
        <h2>Club Checker</h2>
        <p class="subtitle">Enter your details to check club membership</p>
        <form>
            <div class="field">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" placeholder="e.g. Jordan">
            </div>
            <div class="field">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" placeholder="e.g. Smith">
            </div>
            <input type="button" py-click="student_club" value="Search">
        </form>
        <div id="result"></div>
    </div>
    <py-script src="sw.py"></py-script>
</body>
</html>
