<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Periodic Table Finder</title>
    <style>
        nav.navbar {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            background-color: #ffffff !important;
            padding-left: 30px;
            padding-right: 30px;
            width: 100%;
        }

        nav.navbar .nav-link {
            color: #333333 !important;
        }

        :root {
            --bg1: #051b2d;
            --bg2: #0d3b66;
            --panel: rgba(255, 255, 255, 0.12);
            --panel-border: rgba(255, 255, 255, 0.2);
            --card: #f9fbff;
            --text: #16324f;
            --muted: #5d728b;
            --primary: #4cc9f0;
            --primary-strong: #4361ee;
            --shadow: rgba(8, 18, 36, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: white;
        }

        .app-card {
            width: min(92vw, 560px);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 40px var(--shadow);
            border-radius: 20px;
            padding: 28px 22px;
            backdrop-filter: blur(10px);
        }

        .title {
            margin: 0 0 6px;
            text-align: center;
            font-size: clamp(1.7rem, 3vw, 2.5rem);
            letter-spacing: 0.04em;
        }

        .subtitle {
            margin: 0 0 24px;
            text-align: center;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
        }

        form {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        input[type="text"] {
            flex: 1;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.14);
            color: white;
            font-size: 1rem;
            padding: 0 14px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        input[type="button"] {
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: white;
            font-weight: 700;
            font-size: 0.98rem;
            padding: 0 20px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.35);
        }

        input[type="button"]:hover {
            transform: translateY(-1px);
        }

        #result {
            min-height: 150px;
            border-radius: 14px;
            background: var(--card);
            color: var(--text);
            padding: 18px 20px;
            font-size: 1rem;
            line-height: 1.7;
            box-shadow: inset 0 0 0 1px rgba(22, 50, 79, 0.08);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="collapse navbar-collapse show" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Meet the creator</a>
                    </li>
                    <li class="nav-item">
                        <a href="drill.html" class="nav-link">Club Members</a>
                    </li>
                    <li class="nav-item">
                        <a href="sw.html" class="nav-link">Member Checker</a>
                    </li>
                    <li class="nav-item">
                        <a href="skillstest.html" class="nav-link">Element Checker</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="app-card">
        <h1 class="title">Periodic Table Finder</h1>
        <p class="subtitle">Search a chemical symbol to get the element details.</p>

        <form onsubmit="return false;">
            <input type="text" id="symbol_input" placeholder="Enter symbol (e.g. H, O, Rn)">
            <input type="button" py-click="element" value="Search">
        </form>

        <div id="result">Type a symbol to see the element information.</div>
    </main>

    <py-script src="skillstest.py"></py-script>
</body>
</html>
